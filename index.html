<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glowing Garden • Depth Alternation</title>
    <style>
        /* ===================================================
           CENÁRIO NOTURNO & AMBIENTE
           =================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 50% 80%, #200826 0%, #0c0212 55%, #030005 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            cursor: pointer;
        }

        .garden-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        /* Névoa de luz volumétrica no solo */
        .ground-mist {
            position: absolute;
            bottom: -30px;
            width: 140%;
            height: 380px;
            background: radial-gradient(ellipse at 50% 100%, rgba(255, 110, 40, 0.22) 0%, rgba(160, 32, 240, 0.1) 45%, transparent 75%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        .hint-text {
            position: absolute;
            top: 25px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        /* ===================================================
           CAMADAS DE PROFUNDIDADE (3D DEPTH)
           =================================================== */
        .layer-back {
            filter: blur(1.4px) brightness(0.8);
            opacity: 0.75;
        }

        .layer-mid {
            filter: blur(0.3px) brightness(0.95);
            opacity: 0.9;
        }

        .layer-front {
            filter: drop-shadow(0 0 25px rgba(255, 100, 20, 0.5));
            opacity: 1;
        }

        /* ===================================================
           ESTRUTURA DA FLOR
           =================================================== */
        .flora {
            position: absolute;
            bottom: -15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: gentle-wind 8s ease-in-out infinite alternate;
        }

        /* Caule com subida suave e curva */
        .flora-stem {
            width: 4px;
            background: linear-gradient(to top, #140502 0%, #4a1306 40%, #99320e 100%);
            border-radius: 4px;
            position: relative;
            transform-origin: bottom center;
            transform: scaleY(0);
            box-shadow: 0 0 12px rgba(255, 95, 30, 0.25);
            animation: stem-sprout 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: var(--birth-delay);
        }

        /* Folhas brotando lateralmente */
        .flora-leaf {
            position: absolute;
            width: 42px;
            height: 22px;
            background: linear-gradient(135deg, #7a220a 0%, #290802 100%);
            border-radius: 0 100% 0 100%;
            box-shadow: inset 0 0 6px rgba(255, 130, 60, 0.3);
            transform: scale(0);
            animation: leaf-pop 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .leaf-left {
            left: -38px;
            top: 42%;
            transform-origin: right center;
            animation-delay: calc(var(--birth-delay) + 1.1s);
        }

        .leaf-right {
            right: -38px;
            top: 60%;
            transform-origin: left center;
            transform: scaleY(-1);
            animation-delay: calc(var(--birth-delay) + 1.6s);
        }

        /* ===================================================
           CABEÇA DA FLOR & PÉTALAS
           =================================================== */
        .flora-bloom {
            position: absolute;
            top: -45px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            animation: flower-open 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards, core-pulse 4.5s ease-in-out infinite alternate;
            animation-delay: calc(var(--birth-delay) + 2.1s), calc(var(--birth-delay) + 4.3s);
        }

        .flora-petal {
            position: absolute;
            width: 32px;
            height: 60px;
            background: linear-gradient(to top, #e62200 0%, #ff6a00 45%, #ffbb00 80%, #fff7a3 100%);
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            transform-origin: 50% 90%;
            filter: drop-shadow(0 0 14px rgba(255, 110, 20, 0.9)) drop-shadow(0 0 28px rgba(255, 180, 0, 0.5));
            opacity: 0;
            transform: rotate(var(--angle)) scale(0);
            animation: petal-expand 2.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--birth-delay) + 2.2s);
        }

        /* 8 Pétalas radiais */
        .flora-petal:nth-child(1) { --angle: 0deg; }
        .flora-petal:nth-child(2) { --angle: 45deg; }
        .flora-petal:nth-child(3) { --angle: 90deg; }
        .flora-petal:nth-child(4) { --angle: 135deg; }
        .flora-petal:nth-child(5) { --angle: 180deg; }
        .flora-petal:nth-child(6) { --angle: 225deg; }
        .flora-petal:nth-child(7) { --angle: 270deg; }
        .flora-petal:nth-child(8) { --angle: 315deg; }

        /* Miolo Incandescente */
        .flora-core {
            position: absolute;
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #ffffff 15%, #fff294 45%, #ff7700 85%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 24px 10px #ff941a, 0 0 60px 22px rgba(255, 70, 0, 0.7);
            z-index: 10;
        }

        /* ===================================================
           PARTÍCULAS DE PÓLEN FLUTUANTES
           =================================================== */
        .ember-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: float-sky 9s infinite linear;
        }

        .ember-gold {
            background-color: #ffea9f;
            filter: blur(1.5px) drop-shadow(0 0 8px #ffd000);
        }

        .ember-coral {
            background-color: #ff5e36;
            filter: blur(1.5px) drop-shadow(0 0 10px #ff3700);
        }

        /* ===================================================
           KEYFRAMES
           =================================================== */
        @keyframes stem-sprout {
            0% { transform: scaleY(0); }
            100% { transform: scaleY(1); }
        }

        @keyframes leaf-pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes flower-open {
            0% { opacity: 0; transform: scale(0) rotate(-15deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes petal-expand {
            0% { opacity: 0; transform: rotate(var(--angle)) scale(0); }
            60% { opacity: 1; }
            100% { opacity: 0.95; transform: rotate(var(--angle)) scale(1); }
        }

        @keyframes core-pulse {
            0% { filter: brightness(1) drop-shadow(0 0 15px rgba(255, 120, 30, 0.7)); }
            100% { filter: brightness(1.25) drop-shadow(0 0 35px rgba(255, 190, 40, 1)); }
        }

        @keyframes gentle-wind {
            0% { transform: rotate(-2.5deg); }
            100% { transform: rotate(2.5deg); }
        }

        @keyframes float-sky {
            0% { transform: translateY(100vh) translateX(0) scale(0.6); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-40px) translateX(40px) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="hint-text" id="hint">Clique na tela para reiniciar</div>

    <div class="garden-stage" id="stage">
        <div class="ground-mist"></div>
    </div>

    <script>
        /* =========================================================================
           SEQUÊNCIA DE NASCIMENTO COM PROFUNDIDADE 3D INTERCALADA:
           - Alterna entre FUNDO (distante), FRENTE (primeiro plano) e MEIO.
           ========================================================================= */
        const floraData = [
            // 1ª: FUNDO (centro-esquerda) - surge pequenina e distante
            { left: '42%', height: 290, scale: 0.60, delay: 0.5, layer: 'layer-back', zIndex: 2 },

            // 2ª: FRENTE (direita) - BROTA GRANDE e brilhante no primeiro plano!
            { left: '72%', height: 440, scale: 1.20, delay: 2.8, layer: 'layer-front', zIndex: 8 },

            // 3ª: FUNDO (extrema direita) - surge lá atrás na escuridão
            { left: '88%', height: 280, scale: 0.52, delay: 5.2, layer: 'layer-back', zIndex: 2 },

            // 4ª: FRENTE (esquerda) - brota imponente e iluminada na frente!
            { left: '26%', height: 430, scale: 1.15, delay: 7.6, layer: 'layer-front', zIndex: 8 },

            // 5ª: MEIO (centro) - preenche o centro com profundidade média
            { left: '52%', height: 380, scale: 0.95, delay: 10.0, layer: 'layer-mid', zIndex: 5 },

            // 6ª: FUNDO (extrema esquerda) - ilumina o fundo à esquerda
            { left: '10%', height: 270, scale: 0.50, delay: 12.4, layer: 'layer-back', zIndex: 2 },

            // 7ª: MEIO (direita intermediária) - preenche o plano médio direito
            { left: '82%', height: 350, scale: 0.82, delay: 14.6, layer: 'layer-mid', zIndex: 4 },

            // 8ª: FUNDO (centro-direita) - no horizonte
            { left: '60%', height: 300, scale: 0.58, delay: 16.8, layer: 'layer-back', zIndex: 2 },

            // 9ª: MEIO (esquerda intermediária) - fechando o campo harmônico
            { left: '38%', height: 360, scale: 0.88, delay: 18.8, layer: 'layer-mid', zIndex: 5 }
        ];

        const stage = document.getElementById('stage');

        function plantGarden() {
            const oldElements = stage.querySelectorAll('.flora, .ember-particle');
            oldElements.forEach(el => el.remove());

            // 1. Renderiza cada flor com sua camada 3D e delay
            floraData.forEach(item => {
                const flower = document.createElement('div');
                flower.className = `flora ${item.layer}`;
                flower.style.left = item.left;
                flower.style.transform = `scale(${item.scale})`;
                flower.style.zIndex = item.zIndex;
                flower.style.setProperty('--birth-delay', `${item.delay}s`);

                const head = document.createElement('div');
                head.className = 'flora-bloom';

                const core = document.createElement('div');
                core.className = 'flora-core';
                head.appendChild(core);

                for (let p = 0; p < 8; p++) {
                    const petal = document.createElement('div');
                    petal.className = 'flora-petal';
                    head.appendChild(petal);
                }

                const stem = document.createElement('div');
                stem.className = 'flora-stem';
                stem.style.height = `${item.height}px`;

                const leafL = document.createElement('div');
                leafL.className = 'flora-leaf leaf-left';
                const leafR = document.createElement('div');
                leafR.className = 'flora-leaf leaf-right';

                stem.appendChild(leafL);
                stem.appendChild(leafR);
                stem.appendChild(head);
                flower.appendChild(stem);

                stage.appendChild(flower);
            });
            
            for (let i = 0; i < 35; i++) {
                const ember = document.createElement('div');
                const isGold = i % 2 === 0;
                ember.className = `ember-particle ${isGold ? 'ember-gold' : 'ember-coral'}`;

                const size = Math.random() * 5 + 3;
                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${Math.random() * 100}%`;
                ember.style.animationDuration = `${Math.random() * 5 + 7}s`;
                ember.style.animationDelay = `-${Math.random() * 8}s`;

                stage.appendChild(ember);
            }
        }

        plantGarden();

        // Clique para reiniciar a qualquer momento
        document.body.addEventListener('click', () => {
            const hint = document.getElementById('hint');
            if (hint) hint.style.opacity = '0';
            plantGarden();
        });

        // Barra de espaço também reinicia
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                plantGarden();
            }
        });
    </script>
</body>
</html>
